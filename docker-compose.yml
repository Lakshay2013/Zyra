# ── Zyra full local stack ──
# MongoDB + Redis + API + BullMQ worker
#
#   docker compose up -d --build        → start everything
#   docker compose up -d zyra-mongo zyra-redis   → databases only
#
# The API and worker share the same image; only the start command differs.

services:
  # ── MongoDB ──
  zyra-mongo:
    image: mongo:7
    container_name: zyra-mongodb
    ports:
      - "27018:27017"
    volumes:
      - zyra_mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──
  zyra-redis:
    image: redis:7-alpine
    container_name: zyra-redis
    ports:
      - "6380:6379"
    volumes:
      - zyra_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ──
  zyra-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: zyra-backend:local
    container_name: zyra-backend
    command: ["node", "src/index.js"]
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://zyra-mongo:27017/zyra
      - REDIS_HOST=zyra-redis
      - REDIS_PORT=6379
    depends_on:
      zyra-mongo:
        condition: service_healthy
      zyra-redis:
        condition: service_healthy
    restart: unless-stopped

  # ── BullMQ worker (interaction logs + risk analysis) ──
  # Reuses the image built by zyra-backend; only the start command differs.
  zyra-worker:
    image: zyra-backend:local
    pull_policy: never
    container_name: zyra-worker
    command: ["node", "src/workers/index.js"]
    ports:
      - "5001:5001"   # worker health endpoint (README: curl localhost:5001/health)
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://zyra-mongo:27017/zyra
      - REDIS_HOST=zyra-redis
      - REDIS_PORT=6379
    depends_on:
      zyra-mongo:
        condition: service_healthy
      zyra-redis:
        condition: service_healthy
      zyra-backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  zyra_mongo_data:
  zyra_redis_data:
